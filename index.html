    <title>CR Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
        /* Background is now handled by the React App component */
      }
      /* Custom scrollbar for card grid */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px; /* Added height for horizontal scrollbar */
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 3px;
      }
      /* Hide scrollbar for clean look in specific containers if needed */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
